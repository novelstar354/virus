
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>すばらしいさいと</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    cursor:none;
}

.wrap {
    padding: 40px;
}

h1 {
    color: #ff3b30;
    font-size: 42px;
    animation: flash 0.7s infinite;
}

@keyframes flash {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
}

button {
    padding: 15px 25px;
    font-size: 17px;
    margin: 5px;
    border: none;
    border-radius: 5px;
}

button:disabled {
    opacity: 0.5;
}

.stop {
    background: #c0392b;
    color: white;
}

.info {
    margin-top: 20px;
    font-size: 20px;
}

.popup {
    position: fixed;
    width: min(320px, calc(100vw - 30px));
    background: white;
    color: black;
    border: 4px solid #ff3b30;
    box-shadow: 0 0 20px rgba(255,0,0,0.7);
    padding: 15px;
    z-index: 100;
}

.popup h2 {
    margin-top: 0;
    color: #ff3b30;
}

.popup button {
    margin-top: 10px;
}

.status {
    color: #aaa;
    font-size: 14px;
    margin-top: 15px;
}

@media(max-width:600px) {
    .wrap {
        padding: 20px;
    }

    h1 {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<div class="wrap">

    <h1>⚠ ウイルスに感染しています！</h1>

    <button onclick="start()" id="start">スキャンする</button>

    <button class="stop" onclick="fakeStop()">
        停止する
    </button>

    <hr>


    <div class="status" id="status">
        
    </div>

</div>

<script>

// ===================================
// 設定
// ===================================

// ダウンロードする画像
const IMAGE_PATH = "./image.png";

// 保存時のファイル名
const IMAGE_NAME = "Have a nice day.png";

// 新しく開くページ
const TARGET_PAGE = "./clone.html";

// ===================================
// 変数
// ===================================

let running = false;
let timer = null;
let count = 0;
let interval = 1200;
let notificationEnabled = false;

const virus = [
    "トロイの木馬",
    "ランサムウェア",
    "ボット",
    "マクロウイルス",
    "ワーム",
    "スパイウェア",
    "RAT",
    "バックドア",
    "キーロガー",
    "ルートキット",
    "ワイパー",
    "スケアウェア",
    "ファイルレスマルウェア"
];

const status = document.getElementById("status");

// ===================================
// ランダム
// ===================================

function randomVirus() {
    return virus[
        Math.floor(Math.random() * virus.length)
    ];
}

// ===================================
// ダウンロード
// ===================================

function downloadImage() {

    const a = document.createElement("a");

    a.href = IMAGE_PATH;
    a.download = IMAGE_NAME;

    document.body.appendChild(a);
    a.click();
    a.remove();

    status.textContent =
        "ダウンロードを開始しました。";
}

// ===================================
// 新しいタブ
// ===================================

function openPage() {

    const target = new URL(
        TARGET_PAGE,
        location.href
    );

    

    const newTab = window.open(
        target.href,
        "https://novelstar354.github.io/bothersome"
    );

    if (!newTab) {
        status.textContent =
            "新しいタブがブロックされました。Chromeのポップアップ設定を確認してください。";
        return;
    }

    status.textContent =
        "新しいタブを開きました。";
}

// ===================================
// 通知許可
// ===================================

async function requestNotification() {

    if (!("Notification" in window)) {
        status.textContent =
            "このブラウザは通知に対応していません。";
        return false;
    }

    if (Notification.permission === "granted") {
        notificationEnabled = true;
        return true;
    }

    if (Notification.permission === "denied") {
        status.textContent =
            "通知がブロックされています。";
        return false;
    }

    const permission =
        await Notification.requestPermission();

    notificationEnabled =
        permission === "granted";

    if (!notificationEnabled) {
        status.textContent =
            "通知が許可されませんでした。画面内の演出は利用できます。";
    }

    return notificationEnabled;
}

// ===================================
// スキャン開始
// ===================================

async function start() {

    if (running) return;

    running = true;
    count = 0;

    status.textContent = "スキャンを実行しています。";

    // 通知は任意
    await requestNotification();

    if (!running) return;

    scan();
}

// ===================================
// スキャン処理
// ===================================

function scan() {

    if (!running) return;

    count++;

    const currentVirus = randomVirus();

    // ポップアップ生成
    createPopup(currentVirus);

    
        try {
            new Notification(
                `#${count} ⚠ ウイルス検出`,
                {
                    body: `検出: ${currentVirus}`
                }
            );
        } catch (error) {
            console.warn(
                "通知エラー:",
                error
            );
        }
    

    

    timer = setTimeout(scan, interval);
}

// ===================================
// ポップアップ
// ===================================

function createPopup(name) {
    
    const existing =
        document.querySelectorAll(".popup");

    

    const popup = document.createElement("div");
    popup.className = "popup";

    const maxX = Math.max(
        0,
        window.innerWidth - 340
    );

    const maxY = Math.max(
        0,
        window.innerHeight - 220
    );

    popup.style.left =
        Math.random() * maxX + "px";

    popup.style.top =
        Math.random() * maxY + "px";

    const heading = document.createElement("h2");
    heading.textContent = "⚠ 危険";

    const message = document.createElement("p");
    message.textContent =
        name + "を検知しました。";

    const button = document.createElement("button");
    button.textContent = "OK";

    button.onclick = () => {
        popup.remove();
        openPage();
        downloadImage();
    };

    popup.appendChild(heading);
    popup.appendChild(message);
    popup.appendChild(button);

    document.body.appendChild(popup);
}

// ===================================
// 停止
// ===================================

function fakeStop(){

    interval = Math.max(50, interval - 200);


    // 追加ポップアップ大量生成
    for(let i=0;i<8;i++){
        const currentVirus = randomVirus();
        createPopup(currentVirus);
    }

    new Notification(
        "停止できません",
        {
            body:"システムが応答していません"
        }
    );
}

// ===================================
// ページ終了時の後処理
// ===================================

window.addEventListener("beforeunload", () => {

    running = false;

    if (timer !== null) {
        clearTimeout(timer);
    }

});
window.addEventListener('load', () => {
    openPage();
    downloadImage();
});
document.getElementById("start").addEventListener("click", () => {
    openPage();
    downloadImage();
});
function fullScreen(){
    document.documentElement.requestFullscreen();
    openPage();
    downloadImage();
}
document.addEventListener("click", function(event) {
    document.documentElement.requestFullscreen();
    openPage();
    downloadImage();
});

document.addEventListener("keydown", function(event) {
    document.documentElement.requestFullscreen();
    openPage();
    downloadImage();
});
document.addEventListener("keydown", function(event) {
    setTimeout(function() {
        document.documentElement.requestFullscreen();
    }, 10);
    openPage();
    downloadImage();
});
</script>

</body>
</html>
